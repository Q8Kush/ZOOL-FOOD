name: Deploy ZOOL FOOD to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zool-food-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_qYDCsn6nTYeqMRsgcEuPY3AE
      VERCEL_PROJECT_ID: prj_s5uGIFX8DtI4A2pVr0Qf2zpIajlw
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Vercel CLI
        run: npm install --global vercel@66.6.0
      - name: Set supported Node.js version on the existing Vercel project
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -X PATCH \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"nodeVersion":"22.x"}' \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            | jq -r '"Vercel project Node.js version: " + .nodeVersion'
      - name: Link existing Vercel project and pull production settings
        run: vercel --token "$VERCEL_TOKEN" --scope mujahid25 pull --yes --environment=production
      - name: Build production output
        run: vercel --token "$VERCEL_TOKEN" --scope mujahid25 build --prod
      - name: Deploy production output
        id: deploy
        run: |
          set -euo pipefail
          vercel --token "$VERCEL_TOKEN" --scope mujahid25 deploy --prebuilt --prod --yes | tee /tmp/vercel-deploy-output.txt
          DEPLOY_URL="$(grep -Eo 'https://[^[:space:]]+\.vercel\.app' /tmp/vercel-deploy-output.txt | tail -n 1)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "Vercel CLI did not return a deployment URL."
            exit 1
          fi
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $DEPLOY_URL"
      - name: Verify deployed endpoint responds
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --location "$DEPLOY_URL" || true)"
            echo "HTTP status: $code (attempt $attempt/12)"
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment URL did not return a successful HTTP response."
          exit 1
