name: Verify Vercel Access
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vercel-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel token and account
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            https://api.vercel.com/v2/user \
            | jq -r '"Authenticated Vercel account: " + (.username // .name // .id)'
      - name: Verify access to the existing ZOOL-FOOD project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/prj_s5uGIFX8DtI4A2pVr0Qf2zpIajlw?teamId=team_qYDCsn6nTYeqMRsgcEuPY3AE" \
            | jq -r '"Project access confirmed: " + .name + " (" + .id + ")"'
