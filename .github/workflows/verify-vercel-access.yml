name: Configure Supabase and Verify Vercel
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vercel-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure public Supabase variables on the existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_qYDCsn6nTYeqMRsgcEuPY3AE
          VERCEL_PROJECT_ID: prj_s5uGIFX8DtI4A2pVr0Qf2zpIajlw
        run: |
          set -euo pipefail
          add_env() {
            local key="$1"
            local value="$2"
            local payload
            payload="$(jq -n --arg key "$key" --arg value "$value" '{key:$key,value:$value,type:"plain",target:["production","preview","development"]}')"
            code="$(curl --silent --show-error -o /tmp/vercel-env-response.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}&upsert=true")"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              jq -r '.error.message // .message // "Vercel environment update failed"' /tmp/vercel-env-response.json
              exit 1
            fi
            echo "Configured $key ($code)"
          }
          add_env "NEXT_PUBLIC_SUPABASE_URL" "https://pnpigyomvvydidelsypf.supabase.co"
          add_env "NEXT_PUBLIC_SUPABASE_ANON_KEY" "sb_publishable_b6ltPRP6W4-GS0CPUyR-BA_ld_oGqmN"
          echo "Environment variable names now present:"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" \
            | jq -r '.envs[]? | [.key, (.target | join(","))] | @tsv'
