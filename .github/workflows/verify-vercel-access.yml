name: Verify Vercel Project Access
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vercel-access.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify access to the existing Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_qYDCsn6nTYeqMRsgcEuPY3AE
          VERCEL_PROJECT_ID: prj_s5uGIFX8DtI4A2pVr0Qf2zpIajlw
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}" \
            | jq '{id, name, framework, link: {type: .link.type, org: .link.org, repo: .link.repo, productionBranch: .link.productionBranch}}'
          echo "Recent Vercel deployments:"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=5" \
            | jq -r '.deployments[]? | [.uid, .state, (.target // "preview"), .url, .meta.githubCommitSha] | @tsv'
          echo "Configured Vercel environment variable names (values hidden):"
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/env?teamId=${VERCEL_TEAM_ID}" \
            | jq -r '.envs[]? | [.key, (.target | join(","))] | @tsv'
