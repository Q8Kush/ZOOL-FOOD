name: Verify Vercel Production Deployment
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify project access and linked repository
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_qYDCsn6nTYeqMRsgcEuPY3AE
          VERCEL_PROJECT_ID: prj_s5uGIFX8DtI4A2pVr0Qf2zpIajlw
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_TEAM_ID}" \
            | jq '{id,name,framework,repository:.link.repo,productionBranch:.link.productionBranch}'
      - name: Wait for this commit's production deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_qYDCsn6nTYeqMRsgcEuPY3AE
          VERCEL_PROJECT_ID: prj_s5uGIFX8DtI4A2pVr0Qf2zpIajlw
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response="$(curl --silent --show-error --fail-with-body \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_TEAM_ID}&limit=20&target=production")"
            deployment="$(printf '%s' "$response" | jq -c --arg sha "$GITHUB_SHA" '[.deployments[]? | select(.meta.githubCommitSha == $sha)] | first // empty')"
            if [ -n "$deployment" ]; then
              state="$(printf '%s' "$deployment" | jq -r '.state // "UNKNOWN"')"
              url="$(printf '%s' "$deployment" | jq -r '.url // empty')"
              echo "Commit: $GITHUB_SHA"
              echo "Vercel state: $state"
              echo "Deployment URL: https://$url"
              if [ "$state" = "READY" ]; then
                exit 0
              fi
              if [ "$state" = "ERROR" || "$state" = "CANCELED" ]; then
                echo "Vercel deployment did not complete successfully."
                exit 1
              fi
            else
              echo "Waiting for Vercel to register commit $GITHUB_SHA ($attempt/24)"
            fi
            sleep 15
          done
          echo "Timed out waiting for Vercel production deployment."
          exit 1
